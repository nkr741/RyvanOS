# Production stack for cortex.ryvanai.com
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5

  cortex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-app
    restart: unless-stopped
    # Load ALL vars from .env.production into the app (API keys, cron secret,
    # feature flags, outreach config). The `environment:` block below still
    # overrides these specific keys.
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/cortex
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.production}
      NEXTAUTH_URL: https://${DOMAIN:-cortex.ryvanai.com}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads

  nginx:
    image: nginx:alpine
    container_name: cortex-nginx
    restart: unless-stopped
    depends_on:
      - cortex
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/cortex.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    container_name: cortex-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # ── One-off tools (run with: docker compose --profile tools run --rm <service>) ──
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/cortex
    profiles:
      - tools
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx tsx prisma/seed-production.mts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@postgres:5432/cortex
    profiles:
      - tools
    restart: "no"

  backup:
    image: postgres:16-alpine
    container_name: cortex-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-cortex}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: cortex
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: /bin/sh -c "while true; do sleep 86400; /scripts/backup.sh; done"

volumes:
  pgdata:
  uploads:
  certbot-etc:
  certbot-var:
  certbot-webroot:
